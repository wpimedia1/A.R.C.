# Production override for any Docker host (cloud VM, Docker-enabled cloud service).
#   cp deploy/env.example .env      # fill in values; .env is git-ignored
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Genesis happens when the operator presses Start (operator token). After an upgrade that changes the package or engine,
# the existing mission is preserved and execution stops. Review a backup, explicitly upgrade, then resume.
services:
  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  api:
    ports: !reset []
    environment:
      DATABASE_URL: postgresql+psycopg://mission:${POSTGRES_PASSWORD}@database/mission
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      MISSION_OPERATOR_TOKEN: ${MISSION_OPERATOR_TOKEN:?Set MISSION_OPERATOR_TOKEN in .env}
      MISSION_VISITOR_DAILY_LIMIT_USD: ${MISSION_VISITOR_DAILY_LIMIT_USD:-}
      MISSION_VISITOR_MONTHLY_LIMIT_USD: ${MISSION_VISITOR_MONTHLY_LIMIT_USD:-}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=5)"]
      interval: 30s
      retries: 5
  worker:
    environment:
      DATABASE_URL: postgresql+psycopg://mission:${POSTGRES_PASSWORD}@database/mission
      MODEL_API_KEY: ${MODEL_API_KEY:?Set MODEL_API_KEY in .env}
      MISSION_VISITOR_DAILY_LIMIT_USD: ${MISSION_VISITOR_DAILY_LIMIT_USD:-}
      MISSION_VISITOR_MONTHLY_LIMIT_USD: ${MISSION_VISITOR_MONTHLY_LIMIT_USD:-}
      MISSION_PUBLIC_DAILY_LIMIT_USD: ${MISSION_PUBLIC_DAILY_LIMIT_USD:-}
      MISSION_PUBLIC_MONTHLY_LIMIT_USD: ${MISSION_PUBLIC_MONTHLY_LIMIT_USD:-}
  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api]
volumes:
  caddy-data:
