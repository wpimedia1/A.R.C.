# Deployment draft. Confirm the displayed monthly total <= $35 before provisioning.
# Models remain off until an operator explicitly enables them.
services:
  - type: web
    name: mars-mission-api
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: mars-mission-db, property: connectionString}
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_ORIGIN
        sync: false
  - type: worker
    name: mars-mission-worker
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m mission.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: mars-mission-db, property: connectionString}
      - key: MODEL_API_KEY
        sync: false
databases:
  - name: mars-mission-db
    plan: basic-256mb
    databaseName: mission
    user: mission
