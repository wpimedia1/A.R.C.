name: ci
on:
  push: {branches: [main, master]}
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  test-and-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        run: docker build --target test -t mission-test .
      - name: Run tests (isolated SQLite per test)
        run: docker run --rm mission-test
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Push runtime image
        if: github.event_name == 'push'
        run: |
          # Registry names allow only lowercase letters, digits and single separators: wpimedia1/A.R.C. -> wpimedia1/a-r-c
          IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9/]+/-/g; s/-+$//; s#-+/#/#g')
          docker build --target runtime -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
