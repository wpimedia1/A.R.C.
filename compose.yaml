services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mission
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: mission
    volumes: [mission-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mission"]
      interval: 5s
      retries: 12
  api:
    build: .
    ports: ["127.0.0.1:8010:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://mission:local-development-only@database/mission
      COOKIE_SECURE: "false"
      PUBLIC_ORIGIN: http://127.0.0.1:8010
    depends_on:
      database: {condition: service_healthy}
  worker:
    build: .
    command: [python, -m, mission.worker]
    environment:
      DATABASE_URL: postgresql+psycopg://mission:local-development-only@database/mission
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    depends_on:
      database: {condition: service_healthy}
volumes:
  mission-db:
