services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mission
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: mission
    volumes: [mission-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mission"]
      interval: 5s
      retries: 12
  api:
    build: {context: ., target: runtime}
    restart: unless-stopped
    ports: ["127.0.0.1:8020:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://mission:local-development-only@database/mission
      COOKIE_SECURE: "false"
      PUBLIC_ORIGIN: http://127.0.0.1:8020
      MISSION_MODEL_MODE: ${MISSION_MODEL_MODE:-meta}
      # Optional operator settings. Blank values do not stop agent execution.
      MISSION_VISITOR_DAILY_LIMIT_USD: ${MISSION_VISITOR_DAILY_LIMIT_USD:-}
      MISSION_VISITOR_MONTHLY_LIMIT_USD: ${MISSION_VISITOR_MONTHLY_LIMIT_USD:-}
      # Only the operator can start the public mission: set MISSION_OPERATOR_TOKEN in .env next to this file.
      MISSION_OPERATOR_TOKEN: ${MISSION_OPERATOR_TOKEN:-}
    depends_on:
      database: {condition: service_healthy}
  worker:
    build: {context: ., target: runtime}
    restart: unless-stopped
    command: [python, -m, mission.worker]
    env_file:
      - path: ./council-dashboard/backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://mission:local-development-only@database/mission
      MISSION_MODEL_MODE: ${MISSION_MODEL_MODE:-meta}
      MISSION_VISITOR_DAILY_LIMIT_USD: ${MISSION_VISITOR_DAILY_LIMIT_USD:-}
      MISSION_VISITOR_MONTHLY_LIMIT_USD: ${MISSION_VISITOR_MONTHLY_LIMIT_USD:-}
    depends_on:
      database: {condition: service_healthy}
  tests:
    profiles: [test]
    build: {context: ., target: test}
    environment:
      DATABASE_URL: postgresql+psycopg://mission:local-development-only@database/mission
      MISSION_TEST_DATABASE_URL: postgresql+psycopg://mission:local-development-only@database/mission
    depends_on:
      database: {condition: service_healthy}
volumes:
  mission-db:
